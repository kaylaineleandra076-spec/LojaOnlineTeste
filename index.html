<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name=""viewport" content="width=device-width, initial scale=1">
        <title>MyShop</title>
        <link rel="stylesheet" href="style.css">
    </head>
</html>

<body>
    
    <header>
        <div class="Logo">MyShop</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Produtos</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
        <div class="Icones">
            <span>🔍</span>
            <span>👤</span>
            <span>🛒</span>
        </div>
    </header>

    <div class="titulo">
        <h1>Produtos em Destaque</h1>
        <p>Coleção de Verão Novo Design Moderno</p>
    </div>

    <div class="produtos" id="produtos"></div>

    <script>
        var precos = [78,65,72,80,78,65,72,80];
        var lista = document.getElementById("produtos");

        for (var i = 0; i < precos.length; i++){
            lista.innerHTML += `
        <div class="card">
          <img src="camiseta.png" alt="Camiseta">
          <div class="marca">adidas</div>
          <div class="nome">Camisetas de Astronauta em Estilo Cartoon</div>
          <div class="estrelas">★★★★★</div>
          <div class="rodape">
            <span class="preco">$${precos[i]}</span>
            <button class="botao">🛒</button>
          </div>
        </div>
      `;
        }
    </script>
</body>
